# GoReleaser builds the release artefacts. Run `goreleaser check` after editing.
version: 2

project_name: burrow

before:
  hooks:
    - go mod download
    # The admin panel is embedded with go:embed, so it has to exist before any
    # Go build. Rebuilding it here means a release can never ship a panel that
    # is out of step with the source, even if web/dist was committed stale.
    - npm --prefix web ci
    - npm --prefix web run build

builds:
  - id: burrow
    main: ./cmd/burrow
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]

  - id: burrowd
    main: ./cmd/burrowd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # No Windows build: the server wants a wildcard domain, a TCP port pool
    # and a systemd unit. It is a Unix daemon.
    goos: [linux, darwin, freebsd]
    goarch: [amd64, arm64]

archives:
  # Two archives so that someone who only wants the agent does not download
  # the server, which is the common case.
  - id: burrow
    ids: [burrow]
    name_template: "burrow_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: burrowd
    ids: [burrowd]
    name_template: "burrowd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - deploy/*

checksum:
  name_template: "checksums.txt"

# Published to a personal tap (github.com/Suro4ek/homebrew-tap), not to
# homebrew-core: core requires a level of notability a new project does not
# have, and only accepts formulae that build from source.
#
# Casks rather than formulae because that is what Homebrew now wants for
# prebuilt binaries. Casks are macOS-only, which is the right fit anyway — on
# a Linux VPS you want install.sh or the container image.
#
# skip_upload is guarded so a release still succeeds when the tap token is
# missing: the binaries matter more than the cask.
homebrew_casks:
  - name: burrow
    ids: [burrow]
    skip_upload: '{{ if eq (index .Env "HOMEBREW_TAP_TOKEN") "" }}true{{ else }}false{{ end }}'
    repository:
      owner: Suro4ek
      name: homebrew-tap
      branch: main
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    directory: Casks
    homepage: "https://github.com/Suro4ek/burrow"
    description: "Tunnel agent: expose a local port through your own server"
    commit_author:
      name: goreleaser
      email: noreply@github.com
    hooks:
      post:
        # Homebrew quarantines anything it downloads, and macOS then refuses to
        # run it. Clearing the attribute is the documented cask workaround.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/burrow"]
          end

  - name: burrowd
    ids: [burrowd]
    skip_upload: '{{ if eq (index .Env "HOMEBREW_TAP_TOKEN") "" }}true{{ else }}false{{ end }}'
    repository:
      owner: Suro4ek
      name: homebrew-tap
      branch: main
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    directory: Casks
    homepage: "https://github.com/Suro4ek/burrow"
    description: "Self-hosted tunnel server with a web admin panel"
    commit_author:
      name: goreleaser
      email: noreply@github.com
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/burrowd"]
          end

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    **Agent** — download `burrow_*` for your platform, or:

    ```sh
    go install github.com/suro4ek/burrow/cmd/burrow@{{ .Tag }}
    ```

    **Server** — download `burrowd_*`, or use the container image:

    ```sh
    docker pull ghcr.io/suro4ek/burrow:{{ .Version }}
    ```

    See the [README](https://github.com/suro4ek/burrow#readme) for the full setup.
