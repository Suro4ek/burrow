name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # The tunnel code is almost entirely concurrent, so the race detector is
      # the test run that matters.
      - name: Test
        run: go test -race ./...

  web:
    name: Admin panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci

      - name: Typecheck
        run: npm --prefix web run typecheck

      - name: Build
        run: npm --prefix web run build

      # web/dist is committed because go:embed needs it at build time — that is
      # what makes `go install` produce a working panel. This check catches a
      # source change that was never rebuilt.
      #
      # Dependabot is exempt: it can bump package.json but cannot regenerate
      # web/dist, so the check would fail on every dependency PR. Rebuild and
      # commit the panel when merging one — the step below says so out loud.
      - name: Committed panel is up to date
        if: github.actor != 'dependabot[bot]'
        run: git diff --exit-code -- web/dist

      - name: Remind that a dependency bump needs a panel rebuild
        if: github.actor == 'dependabot[bot]'
        run: |
          if ! git diff --quiet -- web/dist; then
            echo "::warning::This bump changes the built panel."
            echo "::warning::Run 'make web' and commit web/dist when merging."
          fi

  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./cmd/burrow

      - name: Build server
        # The server is a Unix daemon; it is not built for Windows.
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./cmd/burrowd
