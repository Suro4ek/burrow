name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...


      # The Dockerfile pins a Go version and go.mod states a minimum; a
      # dependency bump can raise the second without anyone touching the
      # first, and the only symptom is the image build failing at release
      # time, long after the change that caused it.
      - name: Dockerfile Go version covers go.mod
        run: |
          need=$(awk '/^go /{print $2}' go.mod | cut -d. -f1,2)
          have=$(sed -n 's/^FROM golang:\([0-9][0-9.]*\).*/\1/p' Dockerfile | head -1 | cut -d. -f1,2)
          echo "go.mod needs $need, Dockerfile has $have"
          lowest=$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)
          if [ "$lowest" != "$need" ]; then
            echo "::error::Dockerfile uses golang:$have but go.mod requires $need"
            exit 1
          fi

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # The tunnel code is almost entirely concurrent, so the race detector is
      # the test run that matters.
      - name: Test
        run: go test -race ./...

  web:
    name: Admin panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci

      - name: Typecheck
        run: npm --prefix web run typecheck

      - name: Build
        run: npm --prefix web run build

      # web/dist is committed because go:embed needs it at build time — that is
      # what makes `go install` produce a working panel. This check catches a
      # source change that was never rebuilt.
      #
      # Dependabot is exempt: it can bump package.json but cannot regenerate
      # web/dist, so the check would fail on every dependency PR. Rebuild and
      # commit the panel when merging one — the step below says so out loud.
      - name: Committed panel is up to date
        if: github.actor != 'dependabot[bot]'
        run: git diff --exit-code -- web/dist

      - name: Remind that a dependency bump needs a panel rebuild
        if: github.actor == 'dependabot[bot]'
        run: |
          if ! git diff --quiet -- web/dist; then
            echo "::warning::This bump changes the built panel."
            echo "::warning::Run 'make web' and commit web/dist when merging."
          fi

  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./cmd/burrow

      - name: Build server
        # The server is a Unix daemon; it is not built for Windows.
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./cmd/burrowd

  artifacts:
    name: Release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A dry-run release, because the packaging config can break in ways no
      # amount of `go build` catches: a stray edit once shipped a burrowd
      # archive whose executable was named "burrow", and it was only found
      # when someone tried to install it on a server.
      #
      # before hooks are skipped: web/dist is committed, so no npm needed.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=before,publish,docker,sign

      - name: Each archive contains the binary it is named after
        run: |
          set -eu
          fail=0
          for f in dist/burrow_*.tar.gz dist/burrowd_*.tar.gz; do
            name=$(basename "$f")
            want=${name%%_*}
            if tar -tzf "$f" | grep -qx "$want"; then
              echo "ok   $name contains $want"
            else
              echo "FAIL $name does not contain $want:"
              tar -tzf "$f" | sed 's/^/       /'
              fail=1
            fi
          done
          exit $fail
