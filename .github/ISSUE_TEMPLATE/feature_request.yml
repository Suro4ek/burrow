name: Feature request
description: Suggest something burrow should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that burrow makes hard today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: A rough sketch is fine — commands, flags, or panel behaviour.

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds, or other tools that solve it and how.
