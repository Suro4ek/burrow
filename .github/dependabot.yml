version: 2

# Every ecosystem is grouped into a single pull request. Ungrouped, the first
# run opened five separate GitHub Actions PRs, which is noise for a project
# this size — and reviewing a toolchain bump as one change is easier anyway.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
